/* ---------- serves sheet: shared by the week slots and the add flow ---------- */
let SV_CTX = null;   /* {mode:'slot', i, slot} or {mode:'add', id} */
function openSlots(srcI, srcSlot){
  const out = [];
  S.plan.forEach((d,j)=>SLOTS.forEach(([k])=>{
    if(j===srcI && k===srcSlot) return;
    if(d.lock[k]) return;
    const lo = d.lo && d.lo[k];
    const mine = lo && lo[0]===srcI && lo[1]===srcSlot;
    if(d[k]==null || mine) out.push({j, k, on:!!mine});
  }));
  return out;
}
function drawServes(){
  const {i, slot, id} = SV_CTX, r = R[id], lo = leftoverSrc(i, slot);
  const auto = autoServes(i, slot), manual = !!S.plan[i].sv[slot];
  const reuse = openSlots(i, slot);
  svSheetBody.innerHTML = `
    <p class="hint" style="margin-bottom:12px">${esc(r.name)} — the recipe is written for ${r.serves}.</p>

    ${lo ? `<div class="keepnote"><b>Leftovers</b>
        <span>This is ${DAYS[lo[0]]} ${lo[1]} again, so nothing extra gets cooked or bought.
        ${DAYS[lo[0]]} now cooks ${slotServes(lo[0], lo[1])}.</span></div>
      <button class="btn" id="svUnLo" style="width:100%;margin:16px 0 8px">Cook it fresh here instead</button>`
    : `
    ${S.people.length ? `
      <h2 class="sec">Eating this</h2>
      <div class="whogrid">
        ${S.people.map(p=>`<button data-who="${p.id}" aria-pressed="${whoFor(i,slot).includes(p.id)}">${esc(p.name||'?')}${p.half?' ½':''}</button>`).join('')}
      </div>` : ''}

    <h2 class="sec">Cooking</h2>
    <div class="svbig">
      <button id="svMinus" aria-label="Fewer serves" ${SV_CTX.n<=1?'disabled':''}>−</button>
      <span class="n">${SV_CTX.n}</span>
      <button id="svPlus" aria-label="More serves" ${SV_CTX.n>=24?'disabled':''}>+</button>
    </div>
    <p class="hint">${manual || SV_CTX.n!==auto
      ? `Set by hand. <button class="linkbtn" id="svAuto">Back to ${auto} from who is eating</button>`
      : S.people.length ? `Worked out from who is eating${claimsOn(i,slot)?' and the meals reusing it':''}.`
                        : 'The shopping list will buy enough for this many.'}</p>

    ${reuse.length ? `
      <h2 class="sec">Eat it again</h2>
      <p class="hint" style="margin-bottom:2px">Tick another slot and it gets cooked as part of this batch — no extra shopping.</p>
      <div class="whogrid">
        ${reuse.map(o=>`<button data-reuse="${o.j}:${o.k}" aria-pressed="${o.on}">${DAYS[o.j].slice(0,3)} ${o.k}</button>`).join('')}
      </div>` : ''}`}`;

  const un = document.getElementById('svUnLo');
  if(un) un.onclick = ()=>{ unLeftover(i, slot); SV_CTX.n = autoServes(i, slot); drawServes(); drawWeek(); drawShop(); };
  const mi = document.getElementById('svMinus'), pl = document.getElementById('svPlus');
  if(mi) mi.onclick = ()=>{ SV_CTX.n=Math.max(1,SV_CTX.n-1); SV_CTX.manual=true; drawServes(); };
  if(pl) pl.onclick = ()=>{ SV_CTX.n=Math.min(24,SV_CTX.n+1); SV_CTX.manual=true; drawServes(); };
  const au = document.getElementById('svAuto');
  if(au) au.onclick = ()=>{ delete S.plan[i].sv[slot]; SV_CTX.manual=false; SV_CTX.n=autoServes(i,slot); SAVE(); drawServes(); };
}
svSheetBody.addEventListener('click', e=>{
  if(!SV_CTX) return;
  const {i, slot} = SV_CTX;
  const w = e.target.closest('[data-who]'), ru = e.target.closest('[data-reuse]');
  if(w){
    const id = w.dataset.who, cur = whoFor(i, slot).slice();
    S.plan[i].who[slot] = cur.includes(id) ? cur.filter(x=>x!==id) : cur.concat(id);
    if(!SV_CTX.manual) SV_CTX.n = autoServes(i, slot);
    SAVE(); drawServes(); drawWeek(); drawShop();
  }
  if(ru){
    const [j, k] = ru.dataset.reuse.split(':');
    if(leftoverSrc(+j, k)) unLeftover(+j, k);
    else makeLeftover(i, slot, +j, k);
    if(!SV_CTX.manual) SV_CTX.n = autoServes(i, slot);
    SAVE(); drawServes(); drawWeek(); drawShop();
  }
});
function openServes(i, slot){
  SV_CTX = {mode:'slot', i, slot, id:S.plan[i][slot], n:slotServes(i,slot)||autoServes(i,slot),
            manual:!!S.plan[i].sv[slot]};
  svSheetTitle.textContent = DAYS[i]+' '+slot;
  drawServes(); openSheet('svSheet');
}
svDone.onclick = ()=>{
  if(SV_CTX && SV_CTX.mode==='slot' && !isLeftover(SV_CTX.i, SV_CTX.slot)){
    if(SV_CTX.manual) setSlotServes(SV_CTX.i, SV_CTX.slot, SV_CTX.n);
    else { delete S.plan[SV_CTX.i].sv[SV_CTX.slot]; SAVE(); drawWeek(); drawShop(); }
  }
  closeSheet('svSheet');
};

/* ---------- shopping list ---------- */
const AISLES = [
  ['Freezer', /frozen/i],
  ['Pantry', /stock|broth|sauce|paste|powder|seasoning|salsa|pickle|caper|olive(?!\soil)|jerky|biltong/i],
  ['Bakery', /bread|bun$|burger bun|roll$|rolls|wrap|pita|bagel|tortilla|tostada|sponge finger|biscuit|panko|breadcrumb/i],
  ['Dairy, eggs & chilled', /egg|yoghurt|milk|cheese|parmesan|feta|mozzarella|halloumi|ricotta|butter|cottage|tofu|smoked salmon/i],
  ['Meat & seafood', /chicken|beef|steak|mince|lamb|pork|bacon|ham|turkey|sausage|prawn|salmon|barramundi|kingfish|cod|blue grenadier|white fish|squid|mussel|silverside|biltong|jerky|chorizo|shank|smoked fish/i],
  ['Pantry', /canned|tin|passata|paste|sauce|stock|rice|pasta|noodle|oats|flour|powder|honey|vinegar|oil|spice|seed|nori|miso|lentil|quinoa|barley|chickpea|sultana|date|protein|cocoa|chocolate|syrup|sugar|gelatine|popcorn|peanut|almond|walnut|pistachio|cashew|coconut|olive|caper|pickle|jerky/i],
  ['Fruit & vegetables', /potato|onion|garlic|carrot|celery|capsicum|tomato|cucumber|lettuce|cos|spinach|rocket|zucchini|eggplant|pumpkin|broccoli|mushroom|lemon|lime|apple|banana|berr|mango|pineapple|kiwi|avocado|cabbage|wombok|ginger|chilli|coriander|parsley|basil|mint|dill|thyme|spring onion|shallot|leek|sweet potato|corn|snow pea|bok choy|broccolini|apricot|strawberr|blueberr|raspberr|passionfruit|kale|radish|daikon|sprout|edamame|bean|galangal|lemongrass|salad|leaves|herb/i]
];
function aisleOf(name){
  for(const [a,re] of AISLES) if(re.test(name)) return a;
  return 'Pantry';
}
function buildShop(){
  if(!S.plan) return {};
  const agg = new Map();
  S.plan.forEach((d,di)=>SLOTS.forEach(([k])=>{
    const id=d[k]; if(id==null) return;
    if(isLeftover(di,k)) return;        /* already bought as part of the source batch */
    const r=R[id];
    const mult = S.shopMode==='batch' ? (slotServes(di,k)/r.serves) : (1/r.serves);
    const lines = boostedIng(r, !!S.boosted[r.id]).lines;
    lines.forEach(s=>{
      const x = s.match(/^(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)\s*(kg|g|ml|L)\s+(.*)$/);
      if(x) s = (parseFloat(x[1])*parseFloat(x[2]))+x[3]+' '+x[4];
      const p = parseIng(s);
      let qty = p.qty, unit = p.unit;
      if(qty!==null){
        qty *= mult;
        if(unit==='kg'){ qty*=1000; unit='g'; }
        if(unit==='L'){ qty*=1000; unit='ml'; }
        /* spoons and cups become millilitres so they merge with each other */
        if(unit==='tsp'){ qty*=5;   unit='ml'; }
        if(unit==='tbsp'){ qty*=20; unit='ml'; }
        if(unit.startsWith('cup')){ qty*=250; unit='ml'; }
      }
      const name = p.name.split(',')[0].trim();
      const key = name.toLowerCase();
      const cur = agg.get(key) || {name, qty:{}, any:false};
      if(qty===null) cur.any = true;
      else cur.qty[unit] = (cur.qty[unit]||0) + qty;
      agg.set(key, cur);
    });
  }));
  const byAisle = {};
  [...agg.values()].forEach(v=>{
    const a = aisleOf(v.name);
    (byAisle[a] = byAisle[a] || []).push(v);
  });
  Object.values(byAisle).forEach(l=>l.sort((a,b)=>a.name.localeCompare(b.name)));
  return byAisle;
}
function shopUnit(q, u){
  if(u==='g'||u==='ml'){
    q = q<50 ? Math.ceil(q/5)*5 : q<500 ? Math.ceil(q/10)*10 : Math.ceil(q/50)*50;
    if(q>=1000) return (Math.round(q/100)/10)+(u==='g'?'kg':'L');
    return q+u;
  }
  return String(Math.max(1, Math.ceil(q)));   /* a count: you cannot buy half a lemon */
}
function shopQty(v){
  const parts = Object.entries(v.qty||{}).filter(([,q])=>q>0).map(([u,q])=>shopUnit(q,u));
  return parts.join(' + ');
}
const AISLE_ORDER = ['Meat & seafood','Fruit & vegetables','Dairy, eggs & chilled','Bakery','Freezer','Pantry'];
function shopRow(v){
  const key = v.name.toLowerCase();
  const tick = S.shopTicks.includes(key), have = S.shopHave.includes(key);
  return `<li class="${tick&&!have?'done':''}" data-tick="${esc(key)}">
    <span class="q num">${shopQty(v)||'—'}</span><span class="nm">${esc(v.name)}</span>
    <button class="have" data-have="${esc(key)}" aria-pressed="${have}"
      aria-label="${have?'Still need':'Already have'} ${esc(v.name)}">${have?'got it':'have'}</button></li>`;
}
function shopServesLine(){
  if(!S.plan) return '';
  let n=0, meals=0, again=0;
  S.plan.forEach((d,di)=>SLOTS.forEach(([k])=>{
    if(d[k]==null) return;
    if(isLeftover(di,k)){ again++; return; }
    meals++; n += S.shopMode==='batch'?slotServes(di,k):1; }));
  const tail = again ? ` ${again} more ${again>1?'meals are':'meal is'} leftovers, already covered.` : '';
  return S.shopMode==='batch'
    ? `Enough for <b>${n} serves</b> across ${meals} cooks — the numbers each meal is set to in the plan.${tail}`
    : `One serve of each of the ${meals} meals you cook. Switch to <b>As planned</b> to buy the full amounts.${tail}`;
}
function drawShop(){
  const data = buildShop();
  const keys = Object.keys(data);
  shopNote.innerHTML = keys.length ? shopServesLine() : '';
  if(!keys.length){ shopList.innerHTML = `<div class="empty"><h3>No list yet</h3><p>Fill the week and the shopping builds itself.</p></div>`; return; }
  const need = {}, got = [];
  AISLE_ORDER.filter(a=>data[a]).forEach(a=>{
    data[a].forEach(v=> S.shopHave.includes(v.name.toLowerCase()) ? got.push(v) : (need[a]=need[a]||[]).push(v));
  });
  let html = AISLE_ORDER.filter(a=>need[a]).map(a=>`<h4>${a}</h4><ul>${need[a].map(shopRow).join('')}</ul>`).join('');
  if(got.length) html += `<div class="havegroup"><h4>Already at home (${got.length})</h4><ul>${got.map(shopRow).join('')}</ul></div>`;
  if(!Object.keys(need).length) html += `<div class="empty"><h3>Nothing left to buy</h3><p>You already have everything on this week's list.</p></div>`;
  shopList.innerHTML = html;
}
shopList.addEventListener('click', e=>{
  const h=e.target.closest('[data-have]');
  if(h){ const k=h.dataset.have, i=S.shopHave.indexOf(k);
    i<0?S.shopHave.push(k):S.shopHave.splice(i,1);
    SAVE(); drawShop(); return; }
  const li=e.target.closest('[data-tick]'); if(!li) return;
  const k=li.dataset.tick;
  if(S.shopHave.includes(k)) return;          /* already at home — nothing to tick */
  const i=S.shopTicks.indexOf(k);
  i<0?S.shopTicks.push(k):S.shopTicks.splice(i,1);
  SAVE(); drawShop();
});
shopOne.onclick   = ()=>{ S.shopMode='one';   shopOne.setAttribute('aria-selected',true);  shopBatch.setAttribute('aria-selected',false); SAVE(); drawShop(); };
shopOne.setAttribute('aria-selected', S.shopMode==='one');
shopBatch.setAttribute('aria-selected', S.shopMode==='batch');
shopBatch.onclick = ()=>{ S.shopMode='batch'; shopBatch.setAttribute('aria-selected',true); shopOne.setAttribute('aria-selected',false); SAVE(); drawShop(); };
copyShop.onclick  = ()=> Object.keys(buildShop()).length ? copy(shopText(),'Shopping list copied') : toast('Fill the week first');
shareShop.onclick = ()=> Object.keys(buildShop()).length
  ? share('Shopping list', shopText(), 'Shopping list copied') : toast('Fill the week first');
exportShop.onclick = ()=>{
  if(!Object.keys(buildShop()).length) return toast('Fill the week first');
  const d = new Date(), pad = n=>String(n).padStart(2,'0');
  const name = `shopping-list-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.txt`;
  download(name, shopText()) ? toast('Saved as '+name) : copy(shopText(),'Could not save a file, so it is copied instead');
};
segPlan.onclick = ()=>{ segPlan.setAttribute('aria-selected',true); segShop.setAttribute('aria-selected',false); planPane.classList.remove('hidden'); shopPane.classList.add('hidden'); };
segShop.onclick = ()=>{ segShop.setAttribute('aria-selected',true); segPlan.setAttribute('aria-selected',false); shopPane.classList.remove('hidden'); planPane.classList.add('hidden'); drawShop(); };

/* ---------- add to week ---------- */
let ADD_ID = null, ADD_SV = 1;
function drawAdd(){
  const id = ADD_ID, r = R[id];
  addBody.innerHTML = `
    <div class="servrow">
      <span class="lab">Cook <span class="num">${ADD_SV}</span> serve${ADD_SV>1?'s':''}</span>
      <div class="stepper">
        <button id="asDown" aria-label="Fewer serves" ${ADD_SV<=1?'disabled':''}>−</button>
        <span class="n num">${ADD_SV}</span>
        <button id="asUp" aria-label="More serves" ${ADD_SV>=24?'disabled':''}>+</button>
      </div>
    </div>
    <p class="hint" style="margin-bottom:18px">${ADD_SV===r.serves
      ? `The recipe is written for ${r.serves}. The shopping list will buy for ${ADD_SV}.`
      : `Scaled from ${r.serves}. The shopping list will buy enough for ${ADD_SV} serve${ADD_SV>1?'s':''}.`}</p>
    ${S.plan.map((d,i)=>`
    <div class="dayblock"><div class="dayhead"><h3>${DAYS[i]}</h3></div>
    ${SLOTS.map(([k,ab])=>`<div class="slot">
      <span class="kind">${ab}</span>
      <button class="nm" data-put="${i}:${k}">${d[k]==null?'Put it here':'Replace '+esc(R[d[k]].name)}</button>
    </div>`).join('')}</div>`).join('')}`;
  asDown.onclick = ()=>{ ADD_SV=Math.max(1,ADD_SV-1); drawAdd(); };
  asUp.onclick   = ()=>{ ADD_SV=Math.min(24,ADD_SV+1); drawAdd(); };
}
function openAdd(id){
  if(!S.plan){ S.plan = emptyPlan(); S.weekOf = mondayOf(new Date()); }
  ADD_ID = id; ADD_SV = defaultServes(id);
  addTitle.textContent = 'Add '+R[id].name;
  drawAdd();
  openSheet('addSheet');
}
addBody.addEventListener('click', e=>{
  const b=e.target.closest('[data-put]'); if(!b) return;
  const [i,k]=b.dataset.put.split(':');
  if(!S.plan[i].sv) S.plan[i].sv={};
  S.plan[i][k]=ADD_ID; S.plan[i].sv[k]=ADD_SV;
  SAVE(); closeSheet('addSheet'); drawWeek(); drawShop();
  toast(`${DAYS[i]} ${k} — cooking ${ADD_SV}`);
});

/* =======================================================================
   Saved
   ======================================================================= */
function toggleFav(id){
  const i=S.fav.indexOf(id);
  i<0?S.fav.push(id):S.fav.splice(i,1);
  SAVE(); renderList(); drawSaved();
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>b.setAttribute('aria-pressed', S.fav.includes(id)));
}
/* like and bin are one verdict — you cannot hold both */
function rate(id, verdict){
  const other = verdict==='like' ? 'bin' : 'like';
  const a = S[verdict], b = S[other];
  const i = a.indexOf(id);
  if(i<0){ a.push(id); const j=b.indexOf(id); if(j>=0) b.splice(j,1); }
  else a.splice(i,1);
  SAVE(); renderList(); drawSaved(); drawWeek();
  toast(i<0 ? (verdict==='like'?'Marked as a keeper':'Binned — hidden from Find') : 'Verdict cleared');
}
const YOURS = {saved:['fav','saved','Nothing saved','Tap the star on any meal and it lands here.'],
               liked:['like','liked','No verdicts yet','Open a meal you have cooked and tell it what you thought.'],
               binned:['bin','binned','Nothing binned','Anything you mark as not for us gets hidden from Find and lands here.']};
function yoursIds(){ return S[YOURS[S.yours][0]].filter(id=>R[id]); }
function drawSaved(){
  const [,word,eh,ep] = YOURS[S.yours];
  const ids = yoursIds();
  savedCount.textContent = ids.length;
  savedWord.textContent = word;
  shareYours.style.display = ids.length ? '' : 'none';
  ['saved','liked','binned'].forEach(k=>
    document.getElementById('seg'+k[0].toUpperCase()+k.slice(1)).setAttribute('aria-selected', k===S.yours));
  savedList.innerHTML = ids.length
    ? ids.map(id=>cardHTML(R[id])).join('')
    : `<div class="empty"><h3>${eh}</h3><p>${ep}</p></div>`;
}
['saved','liked','binned'].forEach(k=>{
  document.getElementById('seg'+k[0].toUpperCase()+k.slice(1)).onclick = ()=>{ S.yours=k; SAVE(); drawSaved(); scrollTo(0,0); };
});
shareYours.onclick = ()=>{
  const ids = yoursIds();
  if(!ids.length) return toast('Nothing in this list yet');
  const [,word] = YOURS[S.yours];
  const body = ids.map(id=>{ const r=R[id]; const m=macrosFor(r);
    return `- ${r.name} (${m.kcal} cal, ${m.p}g protein, ${r.mins} min)`; }).join('\n');
  share(`Meals we have ${word}`, `Meals we have ${word}:\n\n${body}`, 'List copied');
};

/* =======================================================================
   Sharing — real share sheet where the phone has one, clipboard otherwise
   ======================================================================= */
function share(title, text, fallbackMsg){
  if(navigator.share){
    navigator.share({title, text}).catch(err=>{
      if(err && err.name==='AbortError') return;      /* they backed out — say nothing */
      copy(text, fallbackMsg);
    });
  } else copy(text, fallbackMsg);
}
function recipeText(r){
  const sv = servesFor(r), mult = sv/r.serves, m = macrosFor(r), on = !!S.boosted[r.id];
  const b = boostFor(r, S.boostKey[r.id]);
  const ings = boostedIng(r, on).lines.map(x=>{ const p=scaledParts(x,mult); return '- '+(p.q?p.q+' ':'')+p.n; });
  return [
    r.name.toUpperCase(),
    `${r.cuisine}, ${r.mins} min, makes ${sv} serve${sv>1?'s':''}`,
    `Per serve${on?' (protein boosted)':''}: ${m.kcal} cal, ${m.p}g protein, ${m.c}g carbs, ${m.f}g fat`,
    '', 'INGREDIENTS', ings.join('\n'),
    '', 'METHOD', r.method.map((x,i)=>`${i+1}. ${x}`).join('\n'),
    '', 'KEEPING IT', r.keep
  ].join('\n');
}
function weekText(){
  return S.plan.map((d,i)=>DAYS[i]+'\n'+SLOTS.filter(([k])=>d[k]!=null)
    .map(([k])=>{
      const lo = leftoverSrc(i,k);
      if(lo) return `  ${k} (leftovers from ${DAYS[lo[0]]} ${lo[1]}): ${R[d[k]].name}`;
      const who = S.people.length ? ' for '+whoFor(i,k).map(id=>person(id).name).join(', ') : '';
      return `  ${k} (cook ${slotServes(i,k)}${who}): ${trackerLine(R[d[k]])}`; }).join('\n')).join('\n\n');
}
function shopText(){
  const d = buildShop();
  const blocks = AISLE_ORDER.map(a=>{
    const rows = (d[a]||[]).filter(v=>!S.shopHave.includes(v.name.toLowerCase()));
    if(!rows.length) return null;
    return a.toUpperCase()+'\n'+rows.map(v=>{ const q=shopQty(v); return `- ${q?q+' ':''}${v.name}`; }).join('\n');
  }).filter(Boolean);
  const head = S.shopMode==='batch' ? 'Shopping list — full amounts as planned' : 'Shopping list — one serve of each meal';
  if(!blocks.length) return head+'\n\nNothing to buy — everything is already at home.';
  const skipped = S.shopHave.length ? `\n\nAlready at home, not on this list: ${S.shopHave.join(', ')}` : '';
  return head+'\n\n'+blocks.join('\n\n')+skipped;
}
function download(filename, text){
  try{
    const url = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return true;
  }catch(e){ return false; }
}

/* =======================================================================
   Plumbing
   ======================================================================= */
function openSheet(id){ document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeSheet(id){ document.getElementById(id).classList.remove('open');
  if(!document.querySelector('.sheet.open')) document.body.style.overflow=''; }
document.addEventListener('click', e=>{
  const c=e.target.closest('[data-close]'); if(c) closeSheet(c.dataset.close);
  const o=e.target.closest('[data-open]');
  if(o){ if(PICK && o.closest('#list')) placePick(+o.dataset.open); else openRecipe(+o.dataset.open); }
  const f=e.target.closest('[data-fav]'); if(f) toggleFav(+f.dataset.fav);
  if(e.target.id==='emptyReset'){ S.filters=DEF(); S.q=''; q.value=''; SAVE(); renderList(); }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  document.querySelectorAll('.sheet.open').forEach(s=>closeSheet(s.id));
});
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900); }
function copy(text,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(text).then(done,fallback);
  else fallback();
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity=0;
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy'); done();}catch(e){toast('Could not copy');}
    ta.remove();
  }
}
q.value = S.q;
q.addEventListener('input', ()=>{ S.q=q.value; SAVE(); renderList(); });
sort.value = S.sort;
sort.addEventListener('change', ()=>{ S.sort=sort.value; SAVE(); renderList(); });
dice.onclick = ()=>{
  const pool = results();
  if(!pool.length) return toast('Nothing matches those filters');
  openRecipe(pool[Math.floor(Math.random()*pool.length)].id);
};
function goView(v){
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected', x.dataset.view===v));
  ['find','week','saved'].forEach(n=>document.getElementById('view-'+n).classList.toggle('hidden', n!==v));
}
document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
    ['find','week','saved'].forEach(v=>document.getElementById('view-'+v).classList.toggle('hidden', v!==b.dataset.view));
    if(b.dataset.view==='week') drawWeek();
    if(b.dataset.view==='saved') drawSaved();
    scrollTo(0,0);
  };
});
renderList(); drawSaved(); drawWeek();
