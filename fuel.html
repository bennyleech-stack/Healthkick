<style>
:root{
  --paper:#EFEDE6; --card:#F7F5F0; --sink:#E4E1D7; --ink:#191A17; --ink2:#5F6158; --ink3:#8A8B81;
  --line:#D6D2C6; --chilli:#C63C22; --chilli-d:#A62F19; --mustard:#B5811A; --olive:#4B5A36;
  --shadow:0 1px 0 var(--line);
  --r:10px; --tap:44px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --paper:#16171A; --card:#1F2125; --sink:#26282D; --ink:#EDEBE4; --ink2:#A3A49C; --ink3:#787A73;
  --line:#31343A; --chilli:#E8573A; --chilli-d:#F0705A; --mustard:#D9A23F; --olive:#8FA86A;
  --shadow:0 1px 0 var(--line);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-synthesis-weight:none; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + var(--safe-b));
  overscroll-behavior-y:none;
}
.num{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--chilli);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);
  padding:10px 14px 8px;display:flex;align-items:center;gap:10px}
.brand{font-size:20px;font-weight:800;letter-spacing:-.035em;margin:0}
.brand b{color:var(--chilli)}
.bar .sub{font-size:12px;color:var(--ink3);margin-left:auto;text-align:right;line-height:1.25}
.iconbtn{width:var(--tap);height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:15px}

/* ---------- controls ---------- */
.wrap{padding:12px 14px 0;max-width:720px;margin:0 auto}
.searchrow{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;height:var(--tap)}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}
.search input::placeholder{color:var(--ink3)}
.btn{height:var(--tap);padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.solid{background:var(--chilli);border-color:var(--chilli);color:#fff}
.btn.solid:active{background:var(--chilli-d)}
.btn .pill{background:var(--chilli);color:#fff;border-radius:99px;min-width:19px;height:19px;font-size:12px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.btn.solid .pill{background:rgba(255,255,255,.25)}
.dice{width:100%;margin-bottom:10px;height:52px;font-size:16px}
.resline{display:flex;align-items:baseline;gap:8px;padding:2px 0 10px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.resline .n{font-weight:800;color:var(--ink);font-size:15px}
.linkbtn{min-height:32px;padding:0 4px;color:var(--chilli);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.sortsel{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;height:32px;padding:0 6px;font-size:13px}

/* ---------- recipe card ---------- */
.list{display:flex;flex-direction:column;gap:8px;padding-bottom:24px}
.card{display:flex;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;align-items:stretch}
.card:active{background:var(--sink)}
.pblock{flex:0 0 66px;background:var(--chilli);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px}
.pblock b{font-size:26px;font-weight:800;line-height:1}
.pblock i{font-style:normal;font-size:10px;opacity:.85;margin-top:3px;letter-spacing:.02em}
.cbody{flex:1;padding:10px 12px;min-width:0;text-align:left}
.cname{display:block;font-weight:650;letter-spacing:-.015em;line-height:1.25}
.cmeta{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px}
.cmacros{display:flex;gap:12px;margin-top:7px;font-size:12.5px;color:var(--ink2)}
.cmacros em{font-style:normal;font-weight:700;color:var(--ink)}
.fav{flex:0 0 42px;display:grid;place-items:center;font-size:17px;color:var(--ink3);border-left:1px solid var(--line)}
.fav[aria-pressed="true"]{color:var(--chilli)}

/* ---------- empty ---------- */
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--ink2)}
.empty h3{margin:0 0 6px;font-size:16px;color:var(--ink)}
.empty p{margin:0 0 12px;font-size:14px}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:var(--safe-b)}
.tabs button{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink3);font-weight:600}
.tabs button span{font-size:18px;line-height:1}
.tabs button[aria-selected="true"]{color:var(--chilli)}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheethead{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:5}
.sheethead h2{margin:0;font-size:17px;font-weight:750;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(24px + var(--safe-b));max-width:720px;margin:0 auto;width:100%}
.sheetfoot{border-top:1px solid var(--line);background:var(--paper);padding:10px 14px calc(10px + var(--safe-b));display:flex;gap:8px}
.sheetfoot .btn{flex:1}

/* ---------- filters ---------- */
.fgroup{border-top:1px solid var(--line);padding:14px 0}
.fgroup:first-child{border-top:0;padding-top:4px}
.fgroup h3{margin:0 0 10px;font-size:13px;font-weight:750;color:var(--ink2)}
.dial{margin-bottom:14px}
.dial .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.dial .lab{font-size:14px;font-weight:600}
.dial .val{font-size:14px;font-weight:750}
.dial .val.off{color:var(--ink3);font-weight:600}
input[type=range]{--pct:100%;width:100%;-webkit-appearance:none;appearance:none;background:none;height:28px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;border:1px solid var(--line);background:linear-gradient(to right,var(--chilli) var(--pct),var(--sink) var(--pct))}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;border:1px solid var(--line);background:linear-gradient(to right,var(--chilli) var(--pct),var(--sink) var(--pct))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--card);border:2.5px solid var(--accent,var(--chilli));margin-top:-12px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--card);border:2.5px solid var(--accent,var(--chilli));box-shadow:0 1px 3px rgba(0,0,0,.2)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;font-size:14px;font-weight:600;min-height:38px;display:inline-flex;align-items:center;gap:5px}
.chip[data-state="in"]{background:var(--chilli);border-color:var(--chilli);color:#fff}
.chip[data-state="out"]{background:var(--sink);border-color:var(--ink3);color:var(--ink3);text-decoration:line-through}
.hint{font-size:12.5px;color:var(--ink3);margin:8px 0 0}
.warn{background:var(--card);border:1px solid var(--chilli);border-left-width:4px;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}

/* ---------- recipe detail ---------- */
.rhead h1{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.rhead .meta{font-size:13px;color:var(--ink3);margin-bottom:14px}
.macros{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.macros div{padding:11px 8px;text-align:center;border-left:1px solid var(--line)}
.macros div:first-child{border-left:0;background:var(--chilli);color:#fff}
.macros b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.macros span{display:block;font-size:10.5px;margin-top:3px;opacity:.8}
.macros .kc b{font-size:22px}
.per{font-size:12.5px;color:var(--ink3);text-align:center;margin:7px 0 16px}
.rowbtns{display:flex;gap:8px;margin-bottom:16px}
.rowbtns .btn{flex:1;font-size:14px}
.stepper{display:flex;align-items:center;gap:0;min-width:152px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.stepper button{width:46px;height:44px;font-size:20px;font-weight:700;display:grid;place-items:center}
.stepper button:disabled{color:var(--ink3)}
.stepper .n{flex:1;text-align:center;font-weight:700;border-left:1px solid var(--line);border-right:1px solid var(--line);height:44px;display:grid;place-items:center;font-size:15px}
.servrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.servrow .lab{font-size:14px;font-weight:650;flex:1}
.boostbox{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px;margin-bottom:16px}
.boostbox.on{border-color:var(--chilli);border-left-width:4px}
.boostrow{display:flex;align-items:center;gap:10px}
.boostrow .t{flex:1}
.boostrow .t b{display:block;font-size:14.5px;font-weight:700}
.boostrow .t span{font-size:12.5px;color:var(--ink3)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--sink);border:1px solid var(--line);position:relative;flex:0 0 50px;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--line);transition:transform .15s}
.sw[aria-pressed="true"]{background:var(--chilli);border-color:var(--chilli)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}
.boostdetail{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:13.5px}
.boostdetail select{width:100%;margin-top:8px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 8px}
h2.sec{font-size:13px;font-weight:750;color:var(--ink2);margin:22px 0 9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
ul.ings{list-style:none;margin:0;padding:0}
ul.ings li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:15px;line-height:1.35}
ul.ings li .q{font-weight:700;flex:0 0 auto;min-width:62px}
ul.ings li.added{color:var(--chilli);font-weight:600}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;padding:11px 0 11px 34px;border-bottom:1px solid var(--line);position:relative;font-size:15px;line-height:1.5}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:11px;width:23px;height:23px;border-radius:50%;background:var(--sink);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:750;color:var(--ink2)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tagrow span{font-size:12px;background:var(--sink);border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--ink2)}

/* ---------- week ---------- */
.dayblock{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:10px;overflow:hidden}
.dayhead{display:flex;align-items:baseline;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sink)}
.dayhead h3{margin:0;font-size:14px;font-weight:750}
.dayhead .tot{margin-left:auto;font-size:12px;color:var(--ink2)}
.dayhead .tot b{color:var(--ink);font-weight:750}
.slot{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .kind{flex:0 0 34px;font-size:10.5px;color:var(--ink3);font-weight:700}
.slot .nm{flex:1;min-width:0;text-align:left;font-size:14px;line-height:1.3;font-weight:600}
.slot .nm em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);font-weight:500;margin-top:2px}
.slot .mini{font-size:11px;color:var(--ink3);flex:0 0 auto}
.slot .act{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper)}
.slot .act[aria-pressed="true"]{background:var(--chilli);border-color:var(--chilli);color:#fff}
.slot.blank .nm{color:var(--ink3);font-weight:500}
.targetrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--ink2)}
.targetrow input{width:88px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;font-weight:650;text-align:center}
.dayhead .tot b.under{color:var(--mustard)}
.dayhead .tot b.over{color:var(--olive)}
.shop h4{margin:16px 0 6px;font-size:12px;font-weight:750;color:var(--chilli)}
.shop ul{list-style:none;margin:0;padding:0}
.shop li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;gap:10px;align-items:center}
.shop li .q{font-weight:700;min-width:64px;flex:0 0 auto}
.shop li .nm{flex:1;min-width:0}
.shop li.done .q,.shop li.done .nm{color:var(--ink3);text-decoration:line-through}
.shop li .have{flex:0 0 auto;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:99px;
  font-size:11.5px;font-weight:650;color:var(--ink3);background:var(--card)}
.shop li .have[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.shop .havegroup h4{color:var(--ink3)}
.shop .havegroup li .q,.shop .havegroup li .nm{color:var(--ink3)}
.shopnote{font-size:12.5px;color:var(--ink3);margin:0 0 10px;line-height:1.45}
.svbig{display:flex;align-items:center;justify-content:center;gap:0;margin:6px 0 18px}
.svbig button{width:64px;height:64px;border:1px solid var(--line);background:var(--card);font-size:26px;font-weight:600}
.svbig button:first-child{border-radius:var(--r) 0 0 var(--r)}
.svbig button:last-child{border-radius:0 var(--r) var(--r) 0}
.svbig .n{width:92px;height:64px;display:grid;place-items:center;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.slot .act.sv{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
#addBody .slot{min-height:46px}
#addBody .slot .nm{min-height:34px;display:flex;align-items:center}
.pickbar{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--safe-b));z-index:95;
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);
  background:var(--chilli);color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.pickbar[hidden]{display:none}
.pickbar span{flex:1}
.pickbar .btn{height:34px;padding:0 14px;font-size:13px;background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow input[type=text]{flex:1;min-width:0;height:42px;padding:0 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;font-family:inherit}
.prow .half{height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);font-size:12px;font-weight:650;color:var(--ink3);white-space:nowrap}
.prow .half[aria-pressed="true"]{background:var(--mustard);border-color:var(--mustard);color:#fff}
.prow .del{width:38px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink3);font-size:16px}
.whogrid{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
.whogrid button{height:36px;padding:0 13px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);font-size:13px;font-weight:600;color:var(--ink2)}
.whogrid button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.slot.lo .nm{color:var(--ink2)}
.lotag{display:inline-block;font-size:10px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;
  color:var(--mustard);border:1px solid var(--mustard);border-radius:99px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.slot .act.sv.zero{color:var(--ink3);border-style:dashed}
.updatebar{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--safe-b));z-index:95;
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);
  background:var(--ink);color:var(--paper);font-size:13.5px;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.updatebar[hidden]{display:none}
.updatebar span{flex:1}
.updatebar .btn{height:34px;padding:0 14px;font-size:13px}
.keepnote{border:1px solid var(--line);border-left:3px solid var(--olive);border-radius:8px;
  padding:11px 13px;margin:18px 0 4px;background:var(--card)}
.keepnote b{display:block;font-size:12px;font-weight:750;color:var(--olive);margin-bottom:3px;
  text-transform:uppercase;letter-spacing:.04em}
.keepnote span{font-size:13.5px;color:var(--ink2);line-height:1.5}
.verdict{display:flex;gap:8px;margin:0 0 18px}
.verdict button{flex:1;height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  color:var(--ink2);font-size:13.5px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:7px}
.verdict button svg{flex:0 0 auto}
.verdict button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.verdict button.no[aria-pressed="true"]{background:var(--ink2);border-color:var(--ink2);color:var(--paper)}
.mark{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:99px;
  background:var(--olive);color:#fff;font-size:9px;margin-right:6px;vertical-align:1px;flex:0 0 auto}
.mark.no{background:var(--ink3)}
.card.binned{opacity:.55}
.binrow{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:12px;
  border:1px dashed var(--line);border-radius:var(--r);font-size:13px;color:var(--ink2)}
.binrow .sw{flex:0 0 auto}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);margin-bottom:12px}
.seg button{flex:1;height:38px;font-size:13.5px;font-weight:650;color:var(--ink2)}
.seg button[aria-selected="true"]{background:var(--chilli);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(74px + var(--safe-b));transform:translateX(-50%) translateY(14px);z-index:90;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="bar">
  <h1 class="brand">Fuel<b>.</b></h1>
  <div class="sub" id="subline">200 meals</div>
  <button class="iconbtn" id="themeBtn" aria-label="Switch between light and dark">◐</button>
</header>

<main>
  <!-- ================= FIND ================= -->
  <section id="view-find" class="wrap">
    <div class="searchrow">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="q" type="search" placeholder="Search meals or ingredients" autocomplete="off">
      </label>
      <button class="btn" id="openFilters">Filters <span class="pill hidden" id="fcount">0</span></button>
    </div>
    <button class="btn solid dice" id="dice">I don't know what I want</button>
    <div class="resline">
      <span><span class="n" id="count">0</span> meals</span>
      <button class="linkbtn hidden" id="clearAll">Clear filters</button>
      <select class="sortsel" id="sort" aria-label="Sort meals">
        <option value="p">Most protein</option>
        <option value="liked">Ones we liked</option>
        <option value="dens">Protein per 100 cal</option>
        <option value="kcal">Fewest calories</option>
        <option value="time">Quickest</option>
        <option value="az">A to Z</option>
      </select>
    </div>
    <div class="list" id="list"></div>
  </section>

  <!-- ================= WEEK ================= -->
  <section id="view-week" class="wrap hidden">
    <div class="seg" role="tablist">
      <button role="tab" id="segPlan" aria-selected="true">Plan</button>
      <button role="tab" id="segShop" aria-selected="false">Shopping list</button>
    </div>
    <div id="planPane">
      <div class="searchrow">
        <button class="btn solid" id="genWeek" style="flex:1">Fill the week</button>
        <button class="btn" id="clearWeek">Clear</button>
      </div>
      <p class="hint" id="weekHint" style="margin-bottom:12px"></p>
      <div class="searchrow" style="margin-bottom:10px">
        <button class="btn" id="openPeople" style="flex:1">Who's eating</button>
        <button class="btn" id="reuseBtn" style="flex:1">Dinner → next lunch</button>
      </div>
      <p class="hint" id="whoLine" style="margin:-4px 0 12px"></p>
      <div class="targetrow">
        <span>Daily target</span>
        <input id="tKcal" type="number" inputmode="numeric" placeholder="cal" aria-label="Daily calorie target">
        <input id="tProt" type="number" inputmode="numeric" placeholder="protein" aria-label="Daily protein target">
      </div>
      <div id="days"></div>
      <div class="resline" id="weekTotals" style="padding-top:4px"></div>
      <div class="searchrow" style="margin-bottom:24px">
        <button class="btn" id="copyWeek" style="flex:1">Copy the week</button>
        <button class="btn" id="shareWeek" style="flex:1">Share the week</button>
      </div>
    </div>
    <div id="shopPane" class="hidden">
      <div class="seg">
        <button id="shopOne" aria-selected="true">One serve each</button>
        <button id="shopBatch" aria-selected="false">As planned</button>
      </div>
      <p class="shopnote" id="shopNote"></p>
      <div class="shop" id="shopList"></div>
      <div class="searchrow" style="margin:14px 0 8px">
        <button class="btn" id="copyShop" style="flex:1">Copy</button>
        <button class="btn" id="shareShop" style="flex:1">Share</button>
        <button class="btn solid" id="exportShop" style="flex:1">Export</button>
      </div>
      <p class="hint" style="margin-bottom:24px">Anything marked <b>have</b> is left out of the copy, share and export.</p>
    </div>
  </section>

  <!-- ================= YOURS ================= -->
  <section id="view-saved" class="wrap hidden">
    <div class="seg" role="tablist">
      <button role="tab" id="segSaved" aria-selected="true">Saved</button>
      <button role="tab" id="segLiked" aria-selected="false">Liked</button>
      <button role="tab" id="segBinned" aria-selected="false">Binned</button>
    </div>
    <div class="resline"><span><span class="n" id="savedCount">0</span> <span id="savedWord">saved</span></span>
      <button class="linkbtn" id="shareYours">Share the list</button></div>
    <div class="list" id="savedList"></div>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button role="tab" data-view="find" aria-selected="true"><span aria-hidden="true">⌕</span>Find</button>
  <button role="tab" data-view="week" aria-selected="false"><span aria-hidden="true">▤</span>Week</button>
  <button role="tab" data-view="saved" aria-selected="false"><span aria-hidden="true">★</span>Yours</button>
</nav>

<!-- ================= FILTER SHEET ================= -->
<div class="sheet" id="filterSheet" role="dialog" aria-modal="true" aria-label="Filters">
  <div class="sheethead">
    <h2>Filters</h2>
    <button class="linkbtn" id="resetFilters">Reset</button>
    <button class="iconbtn" data-close="filterSheet" aria-label="Close filters">✕</button>
  </div>
  <div class="sheetbody" id="filterBody"></div>
  <div class="sheetfoot">
    <button class="btn solid" id="applyFilters">Show <span id="liveCount">200</span> meals</button>
  </div>
</div>

<!-- ================= RECIPE SHEET ================= -->
<div class="sheet" id="recipeSheet" role="dialog" aria-modal="true" aria-label="Recipe">
  <div class="sheethead">
    <h2 id="rsTitle">Recipe</h2>
    <button class="iconbtn" id="rsFav" aria-pressed="false" aria-label="Save this meal">★</button>
    <button class="iconbtn" data-close="recipeSheet" aria-label="Close recipe">✕</button>
  </div>
  <div class="sheetbody" id="recipeBody"></div>
  <div class="sheetfoot">
    <button class="btn" id="rsAdd">Add to week</button>
    <button class="btn solid" id="rsCopy">Copy for tracker</button>
  </div>
</div>

<!-- ================= ADD-TO-WEEK SHEET ================= -->
<div class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-label="Add to week">
  <div class="sheethead">
    <h2 id="addTitle">Add to week</h2>
    <button class="iconbtn" data-close="addSheet" aria-label="Close">✕</button>
  </div>
  <div class="sheetbody" id="addBody"></div>
</div>

<!-- ================= PEOPLE SHEET ================= -->
<div class="sheet" id="peopleSheet" role="dialog" aria-modal="true" aria-label="Who's eating">
  <div class="sheethead">
    <h2>Who's eating</h2>
    <button class="iconbtn" data-close="peopleSheet" aria-label="Close">✕</button>
  </div>
  <div class="sheetbody" id="peopleBody"></div>
  <div class="sheetfoot">
    <button class="btn solid" id="peopleDone" style="width:100%">Done</button>
  </div>
</div>

<!-- ================= SERVES SHEET ================= -->
<div class="sheet" id="svSheet" role="dialog" aria-modal="true" aria-label="Serves">
  <div class="sheethead">
    <h2 id="svSheetTitle">How many serves?</h2>
    <button class="iconbtn" data-close="svSheet" aria-label="Close">✕</button>
  </div>
  <div class="sheetbody" id="svSheetBody"></div>
  <div class="sheetfoot">
    <button class="btn solid" id="svDone" style="width:100%">Done</button>
  </div>
</div>

<div class="pickbar" id="pickBar" hidden>
  <span id="pickWhat">Picking a meal</span>
  <button class="btn" id="pickCancel">Cancel</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =======================================================================
   FUEL — high protein, low calorie meal vault
   Single file. No network. State in localStorage under "fuel1".
   ======================================================================= */
const RAW = [["Air Fryer Chickpeas","snack","Mediterranean",4,11,26,5,193,25,"legumes spicy mealprep",["more","canned chickpeas",7,14,2.6,"g"],"800g canned chickpeas, drained and dried|2 tsp olive oil|2 tsp smoked paprika|1 tsp ground cumin|1 tsp garlic powder|0.5 tsp cayenne|1 tsp sea salt","Dry the chickpeas thoroughly on a tea towel — this is the difference between crisp and chewy.|Toss with the oil and half the spices.|Air fry at 200C for 15-18 min, shaking every 5 min.|Toss through the remaining spices and salt while hot.","Keeps about 3 days in a jar with the lid off. Sealed up they go soft."],["Apple Crumble with Protein Oats","dessert","British",4,22,38,8,312,40,"oats fruit dairy mealprep kidfriendly",["more","vanilla whey protein",90,2,1.0,"g"],"5 apples, peeled and diced|100g rolled oats|40g vanilla whey protein|30g almond meal|30g light butter|20g honey|2 tsp cinnamon|1 tsp vanilla extract|1 lemon, juiced|200g low-fat Greek yoghurt, to serve","Toss the apples with the lemon juice, half the cinnamon and a splash of water, then tip into a baking dish.|Rub the butter into the oats, almond meal, protein powder, honey and remaining cinnamon until crumbly.|Scatter the crumble over the apples.|Bake at 180C for 30 min until golden and bubbling. Serve with the yoghurt.","Keeps 3 to 4 days in the fridge. Not one for the freezer."],["Baked Cod with White Beans","dinner","Italian",4,44,30,11,395,35,"fish beans onepan quick prepparts kidfriendly",["more","cod or blue grenadier fillets",19,0,2.0,"g"],"720g cod or blue grenadier fillets|800g canned cannellini beans, drained|300g cherry tomatoes|6 garlic cloves, sliced|150g baby spinach|200ml chicken stock|2 tsp dried Italian herbs|1 tsp chilli flakes|2 tsp olive oil|1 lemon|30g parmesan, grated|Fresh parsley, salt and pepper","Cook the garlic gently in the oil, then add the tomatoes and press them until they burst.|Add the beans, stock, herbs and chilli and simmer 8 min until saucy.|Nestle the seasoned fish into the beans, cover and bake at 200C for 12 min.|Wilt the spinach through, finish with lemon, parmesan and parsley.","Prep the base and sauce ahead. Cook the seafood fresh — reheated it goes rubbery."],["Baked Cottage Cheese Eggs","breakfast","Mediterranean",4,31,9,12,268,30,"eggs dairy mealprep kidfriendly",["more","egg whites",11,0.7,0.2,"g"],"8 eggs|300g low-fat cottage cheese|200g egg whites|150g cherry tomatoes, halved|100g baby spinach|60g reduced-fat feta|2 spring onions, sliced|1 tsp dried oregano|Salt and pepper|Light cooking spray","Whisk the eggs, egg whites and cottage cheese with the oregano, salt and pepper.|Fold through the spinach, spring onion and half the tomatoes.|Pour into a sprayed baking dish, scatter the feta and remaining tomatoes over the top.|Bake at 180C for 25 min until just set with a slight wobble. Cools well for the week.","Keeps 3 to 4 days in the fridge. Not one for the freezer."],["Baked Feta & Chickpea Pasta","dinner","Mediterranean",4,26,62,11,451,40,"pasta cheese legumes veg onepan mealprep kidfriendly",["more","canned chickpeas",7,14,2.6,"g"],"200g light feta, in one block|400g cherry tomatoes|800g canned chickpeas, drained|280g dry penne|4 garlic cloves, sliced|2 tbsp olive oil|1 tsp dried oregano|0.5 tsp chilli flakes|20g basil leaves|0.5 tsp salt","Heat the oven to 200C.|Put the feta in the middle of a baking dish and surround it with the tomatoes, chickpeas and garlic. Drizzle with the oil and scatter the oregano, chilli and salt.|Bake 30 minutes until the tomatoes burst and the feta is soft.|Cook the pasta meanwhile and reserve a cup of the water.|Crush everything in the dish together into a sauce, loosening with pasta water.|Fold through the pasta and basil.","Keeps 3 to 4 days in the fridge. Not one for the freezer."],["Baked Protein Custard","dessert","European",4,22,14,6,198,45,"dairy eggs mealprep kidfriendly",["more","vanilla whey protein",90,2,1.0,"g"],"500ml skim milk|300g egg whites|3 eggs|40g vanilla whey protein|30g honey|2 tsp vanilla extract|1 tsp ground nutmeg|Pinch of salt","Warm the milk with the vanilla, then cool slightly.|Whisk the eggs, egg whites, honey and salt, then slowly pour in the warm milk while whisking.|Whisk in the protein powder last and strain the mixture through a sieve.|Pour into ramekins, grate nutmeg over and bake at 160C in a water bath for 35 min until just set.","Keeps 3 to 4 days in the fridge. Not one for the freezer."],["Baked Salmon with Greek Salad","dinner","Greek",4,42,18,20,420,30,"salmon veg quick prepparts kidfriendly",["more","salmon fillets",21,0,6.0,"g"],"720g salmon fillets|300g cherry tomatoes|1 cucumber, chopped|150g red onion, sliced|80g kalamata olives|80g reduced-fat feta|2 lemons|2 tsp dried oregano|2 tsp olive oil|1 tbsp red wine vinegar|Salt and cracked pepper","Season the salmon with oregano, salt, pepper and half the lemon juice.|Bake at 200C for 12-14 min — pull it while the centre is still slightly translucent.|Toss the tomato, cucumber, onion and olives with the vinegar, oil and remaining lemon.|Crumble the feta over the salad and serve alongside the salmon.","Cook the protein and mix the dressing ahead. Keep the leaves dry and separate or they wilt by day two."],["Banana Protein Nice Cream","dessert snack","Cafe",2,26,34,4,276,5,"dairy fruit nocook quick mealprep freezer kidfriendly",["more","vanilla whey protein",90,2,1.0,"g"],"3 frozen bananas, sliced|30g vanilla whey protein|150g low-fat Greek yoghurt|100ml skim milk|10g peanut butter powder|1 tsp cinnamon","Freeze the banana slices on a tray so they do not clump.|Blend them with the milk, working the blender in pulses at first.|Add the protein powder, yoghurt, peanut butter powder and cinnamon.|Blend until it turns glossy and soft-serve thick.","Lives in the freezer. Sit it out for 10 minutes before scooping."],["Banana Protein Smoothie","breakfast snack","Cafe",1,44,42,6,398,3,"dairy fruit nocook quick kidfriendly",["more","vanilla whey protein",90,2,1.0,"g"],"1 banana, frozen|30g vanilla whey protein|200g low-fat Greek yoghurt|200ml skim milk|10g peanut butter powder|1 tsp cinnamon|Ice","Add the milk first, then everything else.|Blend on high for 45 seconds.|Add ice and blend again until thick.|Drink straight away while it is still cold and aerated.","Make it and eat it. The texture is the whole point and it does not survive a night."],["Beef & Barley Soup","lunch dinner","British",4,36,36,9,369,90,"beef legumes slowcooker mealprep freezer kidfriendly",["more","lean beef chuck",21,0,6.0,"g"],"600g lean beef chuck, diced|150g pearl barley|1.5L beef stock|150g onion, diced|2 carrots, diced|2 celery stalks, diced|200g mushrooms, sliced|4 garlic cloves, crushed|2 tbsp tomato paste|2 tsp dried thyme|2 bay leaves|1 tbsp Worcestershire sauce|2 tsp olive oil|Salt, pepper and parsley","Brown the beef hard in batches in the oil and set aside.|Soften the onion, carrot, celery, mushroom and garlic, then stir in the tomato paste and thyme.|Return the beef with the barley, stock, bay leaves and Worcestershire.|Simmer covered for 75 min until the beef pulls apart and the barley is tender. Better the next day.","Keeps 4 days in the fridge and freezes well — portion it before it goes in."],["Beef & Broccoli Stir Fry","dinner","Chinese",4,46,42,11,451,25,"beef rice veg quick mealprep kidfriendly",["more","lean rump steak",22,0,5.0,"g"],"700g lean rump steak, thinly sliced|500g broccoli florets|200g jasmine rice (raw weight)|4 garlic cloves, crushed|2 tsp grated ginger|4 tbsp light soy sauce|2 tbsp oyster sauce|2 tsp honey|2 tsp cornflour|1 tsp sesame oil|1 tsp olive oil|2 spring onions, sliced|0.5 tsp white pepper","Toss the beef with 1 tsp cornflour, a splash of soy and the white pepper. Leave 15 min — it keeps the meat tender.|Cook the rice by absorption.|Sear the beef in a screaming hot pan in two batches, 60 seconds each, and remove.|Stir fry the broccoli with a splash of water until bright green, add the garlic and ginger, then the sauce thicken he bottom of two jars.|Add the chickpeas, then tomato, cucumber and onion.|Top with the flaked tuna and parsley. Shake when you are ready to eat.","Keeps 3 to 4 days in the fridge. Not one for the freezer."],["Chicken & Chorizo Paella","dinner","Spanish",6,40,52,13,485,50,"chicken rice onepan mealprep freezer kidfriendly",["more","chicken thigh fillets",20,0,8.0,"g"],"800g chicken thigh fillets, cubed|150g lean chorizo, sliced|400g paella rice|1.3L chicken stock|150g onion, diced|1 red capsicum, sliced|6 garlic cloves, crushed|400g canned crushed tomatoes|2 tsp smoked paprika|1 tsp saffron threads|200g frozen peas|2 lemons|2 tsp olive oil|Fresh parsley","Render the chorizo, then brown the chicken in the same pan and set both aside.|Soften the onion, capsicum and garlic, then add the paprika and rice and stir for 1 min.|Add the tomatoes, saffron and hot stock, return the chicken and chorizo, and simmer without stirring for 20 min.|Scatter the peas over for the last 5 min, rest 5 min off the heat, and serve with lemon and parsley.","Keeps 4 days in the fridge and freezes well — portion it before it goes in."],["Chicken & Corn Soup","lunch","Chinese",4,34,20,5,266,25,"chicken eggs corn mealprep freezer kidfriendly",["more","chicken breast",23,0,1.5,"g"],"500g chicken breast, shredded|1.2L chicken stock|300g creamed corn|150g corn kernels|200g egg whites|2 tsp grated ginger|3 garlic cloves, crushed|2 tbsp light soy sauce|2 tsp cornflour|1 tsp sesame oil|3 spring onions, sliced|0.5 tsp white pepper","Poach the chicken breasts in the stock for 12 min, then remove and shred.|Add the ginger, garlic, both corns and the soy to the stock and simmer 5 min.|Thicken with the cornflour slaked in cold water.|Turn off the heat and pour the egg whites in a thin stream while stirring one direction. Return the chicken, finish with sesame oil, spring onion and white pepper.","Keeps 4 days in the fridge and freezes well — portion it before it goes in."],["Chicken & Leek Pot Pie","dinner" es well — portion it before it goes in."],["Lamb Kofta with Tzatziki","dinner","Middle Eastern",4,42,26,16,416,35,"lamb dairy mealprep kidfriendly",["more","lean lamb mince",20,0,9.0,"g"],"800g lean lamb mince|150g onion, grated and squeezed dry|4 garlic cloves, crushed|2 tsp ground cumin|2 tsp ground coriander|1 tsp cinnamon|1 tsp smoked paprika|300g low-fat Greek yoghurt|1 cucumber, grated and squeezed|1 lemon|2 wholemeal pitas|150g tomato, diced|60g red onion, sliced|Fresh mint and parsley|Salt and pepper","Mix the lamb with the grated onion, half the garlic, all the spices and plenty of salt. Work it hard for a minute so it binds.|Shape onto skewers and grill 4-5 min a side until charred.|Mix the cucumber, remaining garlic, mint and lemon juice into the yoghurt.|Serve with warm pita, chopped tomato, red onion and the tzatziki.","Keeps 3 to 4 days in the fridge. Not one for the freezer."],["Lamb Rogan Josh","dinner","Indian",6,40,32,16,432,150,"lamb rice slowcooker mealprep freezer",["more","lean lamb leg",20,0,5.0,"g"],"1.2kg lean lamb leg, cubed|300g low-fat Greek yoghurt|150g onion, sliced|6 garlic cloves, crushed|2 tbsp grated ginger|400g canned crushed tomatoes|2 tbsp Kashmiri chilli powder|2 tsp ground cumin|2 tsp ground coriander|1 tsp turmeric|1 tsp garam masala|4 cardamom pods|1 cinnamon stick|2 bay leaves|300ml beef stock|2 tsp olive oil|Fresh coriander","Brown the lamb in batches and set aside.|Cook the onion until deeply golden, then add the garlic, ginger and whole spices.|Add the ground spices, tomatoes and stock, return the lamb and simmer covered for 90 min.|Take off the heat, cool 5 min, then stir the yoghurt through gradually so it does not split. Finish with garam masala and coriander.","Keeps 4 days in the fridge and freezes well — portion it before it goes in."],["Lamb Shank Braise with Mash","dinner","European",4,46,38,16,480,210,"lamb potato slowcooker mealprep freezer kidfriendly",["more","lamb shanks",19,0,6.0,"g"],"1.4kg lamb shanks|800g e frozen mango with the milk until smooth.|Add the yoghurt, protein powder, honey and cardamom and blend again.|Pour into two glasses.|Chill 20 min and top with pistachios.","Make it and eat it. The texture is the whole point and it does not survive a night."],["Marry Me Chicken","dinner","Italian",4,53,14,13,385,35,"chicken dairy onepan mealprep kidfriendly",["more","chicken breast",23,0,1.5,"g"],"800g chicken breast, butterflied|300ml light evaporated milk|80g sun-dried tomatoes, drained and sliced|250ml salt-reduced chicken stock|30g parmesan, grated|4 garlic cloves, crushed|2 tsp olive oil|1 tsp dried oregano|0.5 tsp chilli flakes|2 tsp cornflour|20g basil, torn","Season the chicken and sear in the oil over high heat, 4 minutes a side, until golden. Set aside.|Soften the garlic and sun-dried tomatoes in the same pan for 1 minute.|Add the stock, evaporated milk, oregano and chilli and simmer 3 minutes.|Slake the cornflour in a splash of water, stir it in and let the sauce thicken.|Return the chicken with any resting juices and simmer 4 minutes.|Stir through the parmesan and basil off the heat.","Keeps 3 to 4 days in the fridge. Not one for the freezer."],["Meatloaf with Hidden Veg","dinner","American",6,40,17,13,345,70,"beef veg mealprep freezer kidfriendly",["more","extra lean beef mince (5%)",21,0,5.0,"g"],"800g extra lean beef mince (5%)|200g pork mince|150g carrot, grated|150g zucchini, grated|120g onion, finely diced|1 large egg|60g rolled oats|3 garlic cloves, crushed|2 tbsp Worcestershire sauce|100g passata|2 tbsp tomato paste|1 tsp smoked paprika|1 tsp dried thyme|0.5 tsp salt","Heat the oven to 180C and line a loaf tin.|Squeeze the grated zucchini dry.|Mix both minces with the carrot, zucchini, onion, garlic, egg, oats, Worcestershire, thyme and salt.|Press into the tin and smooth the top.|Whisk the passata, tomato paste and paprika and spread over.|Bake 50-55 minutes, then rest 10 minutes before slicing.","Keeps 4 days in the fridge and freezes well — p  and remove.|Cook the garlic, ginger and chilli, add the soy, hoisin and honey, return the beef with the spring onion and toss until glazed. Finish with sesame oil.","Keeps 3 to 4 days in the fridge. Not one for the freezer."],["Moroccan Chickpea & Chicken Salad","lunch","Moroccan",2,42,40,11,427,25,"chicken legumes prepparts kidfriendly",["more","chicken breast",23,0,1.5,"g"],"400g chicken breast|400g canned chickpeas, drained|100g baby spinach|150g cherry tomatoes|80g red onion, sliced|100g low-fat Greek yoghurt|2 tsp ras el hanout|1 tsp ground cumin|1 tsp smoked paprika|1 lemon|2 tsp olive oil|40g dried apricots, sliced|Fresh mint and parsley","Rub the chicken with the ras el hanout, cumin and half the oil and grill until cooked. Rest and slice.|Crisp the chickpeas in a hot pan with the paprika and remaining oil.|Thin the yoghurt with lemon juice and a pinch of ras el hanout.|Toss the spinach, tomato, onion, apricots and chickpeas, top with the chicken and spoon the dressing over.","Cook the protein and mix the dressing ahead. Keep the leaves dry and separate or they wilt by day two."],["Mushroom & Halloumi Scramble","breakfast","Mediterranean",2,34,8,15,303,15,"eggs cheese quick kidfriendly",["more","egg whites",11,0.7,0.2,"g"],"300g egg whites|2 eggs|80g reduced-fat halloumi, diced|200g mushrooms, sliced|100g baby spinach|2 garlic cloves, crushed|1 tsp olive oil|1 tsp dried thyme|Salt and cracked pepper","Fry the halloumi in a dry hot pan until golden on both sides, then set aside.|Cook the mushrooms hard in the oil until browned, then add the garlic, thyme and spinach.|Pour in the whisked eggs and stir slowly over low heat.|Fold the halloumi back through just before the eggs finish setting.","Eggs turn rubbery reheated. This one is a cook-and-eat."],["Mussels in Tomato Broth","dinner","Spanish",4,34,30,9,337,25,"seafood bread quick",["more","mussels",12,3,2.0,"g"],"1.6kg mussels, scrubbed and debearded|400g canned crushed tomatoes|150ml white wine|150g onion, const F = ['name','types','cuisine','serves','p','c','f','kcal','mins','tags','boost','ing','method','keep'];
const R = RAW.map((a,i)=>{
  const o={id:i};
  F.forEach((k,j)=>o[k]=a[j]);
  o.types = o.types.split(' ');
  o.tags  = o.tags.split(' ');
  o.ing   = o.ing.split('|');
  o.method= o.method.split('|');
  o.dens  = o.p/(o.kcal/100);
  o.search= (o.name+' '+o.cuisine+' '+o.tags.join(' ')+' '+o.ing.join(' ')).toLowerCase();
  return o;
});

  whey_van: {n:'vanilla whey protein',      p:90,  c:2,   f:1,   unit:'g'},
  whey_choc:{n:'chocolate whey protein',    p:90,  c:2,   f:1,   unit:'g'},

};
const BOOST_KEYS = ['whey_van','eggwhite','chicken','mince','tuna','prawns','cottage','greekyog','chickpeas','tofu'];

function fmtQty(v, unit){
  if(!unit) return String(Math.round(v));
  if(v>=1000 && (unit==='g'||unit==='ml')) return (Math.round(v/10)/100)+(unit==='g'?'kg':'L');
  return Math.round(v)+unit;
}
function boostOptions(r){
  const cur = S.boostKey[r.id] || null;
  const own = boostFor(r, null);
  const opts = [];
  if(own.mode==='more')
    opts.push({val:'', sel:!cur, label:`more ${own.name} — +${own.dkcal} cal (in the recipe already)`});
  BOOST_KEYS.map(k=>boostFor(r,k))
    .filter(t=>own.mode!=='more' || t.key!==own.key)
    .sort((x,y)=>x.dkcal-y.dkcal)
    .forEach((t,i)=>opts.push({val:t.key, sel:cur===t.key || (own.mode!=='more' && !cur && i===0 && t.key===own.key),
      label:`stir in ${t.name} — +${t.dkcal} cal`}));
  if(own.mode!=='more' && !cur) opts.forEach(o=>o.sel = o.val===own.key);
  return opts;
}
function roundG(v){ return v<50 ? Math.max(5, Math.round(v/5)*5) : Math.round(v/10)*10; }

/* Which ingredient line the recipe's own boost scales up. */
function boostLineIdx(r, target){
  return r.ing.findIndex(l=>{
    const m = l.match(/^(\d+(?:\.\d+)?)\s*(kg|g|ml|L)?\s+(.*)$/);
    return m && m[3].split(',')[0].trim().toLowerCase() === target;
  });
}

/* key === null  -> the recipe's own contextual boost (usually more of what is already in it)
   key === a BOOST key -> stir in something extra instead */
function boostFor(r, key){
  const extraP = r.p * 0.2 * r.serves;           // +20% per serve, across the batch
  if(!key && Array.isArray(r.boost) && r.boost[0]==='more'){
    const [, target, p, c, f, kind] = r.boost;
    const idx = boostLineIdx(r, target);
    if(idx >= 0){
      let qty, unit, dp, dc, df;
      if(kind === 'ea'){
        qty = Math.max(1, Math.round(extraP/p)); unit = '';
        dp = p*qty; dc = c*qty; df = f*qty;
      } else {
        qty = roundG(extraP/(p/100)); unit = 'g';
        dp = p*qty/100; dc = c*qty/100; df = f*qty/100;
      }
      const cur = curQty(r.ing[idx]);
      return {mode:'more', key:null, name:target, idx, grams:qty, unit, kind,
              from:cur.qty, to:cur.qty+qty, fromUnit:cur.unit,
              dp:+(dp/r.serves).toFixed(1), dc:+(dc/r.serves).toFixed(1), df:+(df/r.serves).toFixed(1),
              dkcal:Math.round((4*dp+4*dc+9*df)/r.serves)};
    }
  }
  const k = key || (Array.isArray(r.boost) ? r.boost[1] : r.boost) || 'whey_van';
  const b = BOOST[k] || BOOST.whey_van;
  const grams = roundG(extraP/(b.p/100));
  const dp = b.p*grams/100, dc = b.c*grams/100, df = b.f*grams/100;
  return {mode:'add', key:k, name:b.n, grams, unit:'g',
          dp:+(dp/r.serves).toFixed(1), dc:+(dc/r.serves).toFixed(1), df:+(df/r.serves).toFixed(1),
          dkcal:Math.round((4*dp+4*dc+9*df)/r.serves)};
}
function curQty(line){
  const m = line.match(/^(\d+(?:\.\d+)?)\s*(kg|g|ml|L)?\s+/);
  if(!m) return {qty:0, unit:''};
  let q = parseFloat(m[1]), u = m[2]||'';
  if(u==='kg'){ q*=1000; u='g'; }
  if(u==='L'){ q*=1000; u='ml'; }
  return {qty:q, unit:u};
}
/* The ingredient list the recipe actually needs, boost included.
   A 'more' boost rewrites the existing line, so nothing appears twice. */
function boostedIng(r, on){
  if(!on) return {lines:r.ing.slice(), idx:-1};
  const b = boostFor(r, S.boostKey[r.id]);
  const lines = r.ing.slice();
  if(b.mode==='more'){
    const rest = lines[b.idx].replace(/^(\d+(?:\.\d+)?)\s*(kg|g|ml|L)?\s+/, '');
    lines[b.idx] = (b.unit ? `${b.to}${b.unit} ` : `${b.to} `) + rest;
    return {lines, idx:b.idx, b};
  }

function publishPlan(){

      const meals = {};

/* the Monday of the week a plan was made for, so a reader can tell if it is stale */

  const x = new Date(d); x.setHours(0,0,0,0);

/* =======================================================================
   Quantity scaling — everything stays in grams / millilitres
   ======================================================================= */
const UNIT_RE = /^(\d+(?:\.\d+)?)\s*(kg|g|ml|L|tsp|tbsp|cups?)?(?=\s|$)/;
const FRAC = {0.25:'¼',0.5:'½',0.75:'¾',0.33:'⅓',0.67:'⅔'};

function fmtNum(v){
  const whole = Math.floor(v), rem = +(v-whole).toFixed(2);
  if(FRAC[rem]) return (whole?whole:'')+FRAC[rem];
  return String(+v.toFixed(v<10?1:0));
}
function roundMetric(v){
  if(v<10)  return Math.round(v*2)/2;
  if(v<50)  return Math.round(v);
  if(v<250) return Math.round(v/5)*5;
  return Math.round(v/10)*10;
}
function parseIng(s){
  const m = s.match(UNIT_RE);
  if(!m) return {qty:null, unit:'', name:s.trim(), raw:s};
  return {qty:parseFloat(m[1]), unit:(m[2]||''), name:s.slice(m[0].length).trim(), raw:s};
}
function scaledParts(s, mult){
  const p = parseIng(s);
  if(p.qty===null) return {q:'', n:p.name};
  let v = p.qty*mult, u = p.unit;
  if(u==='kg'){ v*=1000; u='g'; }
  if(u==='L'){ v*=1000; u='ml'; }
  if((u==='g'||u==='ml')){
    v = roundMetric(v);
    if(v>=1000 && v%100===0) return {q:(v/1000)+(u==='g'?'kg':'L'), n:p.name};
    return {q:fmtNum(v)+u, n:p.name};
  }
  if(u==='tsp'||u==='tbsp'){ v = Math.round(v*4)/4; return {q:fmtNum(v)+' '+u, n:p.name}; }
  if(u&&u.startsWith('cup')){ v = Math.round(v*4)/4; return {q:fmtNum(v)+' cup', n:p.name}; }
  v = Math.round(v*2)/2;
  return {q:fmtNum(v), n:p.name};
}
function scaleIng(s, mult){
  const {q,n} = scaledParts(s, mult);
  return q ? q+' '+n : n;
}

/* =======================================================================
   Filtering
   ======================================================================= */
function activeCount(){
  const d=DEF(), f=S.filters; let n=0;
  if(f.kcal!==d.kcal)n++; if(f.p!==d.p)n++; if(f.c!==d.c)n++; if(f.f!==d.f)n++;
  if(f.mins!==d.mins)n++; if(f.types.length)n++; if(f.attrs.length)n++;
  if(f.cuisine)n++; n+=Object.keys(f.ing).length;
  return n;
}
function match(r, f){
  if(!S.showBin && S.bin.includes(r.id)) return false;
  if(r.kcal>f.kcal) return false;
  if(r.p<f.p) return false;
  if(r.c>f.c) return false;
  if(r.f>f.f) return false;
  if(r.mins>f.mins) return false;
  if(f.types.length && !f.types.some(t=>r.types.includes(t))) return false;
  if(f.cuisine && r.cuisine!==f.cuisine) return false;
  for(const a of f.attrs) if(!r.tags.includes(a)) return false;
  for(const [k,v] of Object.entries(f.ing)){
    const has = r.tags.includes(k);
    if(v==='in' && !has) return false;
    if(v==='out' && has) return false;
  }
  if(S.q){ const q=S.q.toLowerCase().trim(); if(q && !r.search.includes(q)) return false; }
  return true;
}
function results(f){
  const out = R.filter(r=>match(r, f||S.filters));
  const s = S.sort;
  const lk = r => S.like.includes(r.id)?0:1;
  out.sort((a,b)=>
    s==='liked'? (lk(a)-lk(b)) || (b.p-a.p) :
    s==='p'? b.p-a.p :
    s==='dens'? b.dens-a.dens :
    s==='kcal'? a.kcal-b.kcal :
    s==='time'? a.mins-b.mins :
    a.name.localeCompare(b.name));
  return out;
}

    if(!cur) f.ing[k]='in'; else if(cur==='in') f.ing[k]='out'; else delete f.ing[k];
  }
  SAVE(); drawFilters();
});
openFilters.onclick  = ()=>{ drawFilters(); openSheet('filterSheet'); };
applyFilters.onclick = ()=>{ closeSheet('filterSheet'); renderList(); };
resetFilters.onclick = ()=>{ S.filters=DEF(); SAVE(); drawFilters(); };
clearAll.onclick     = ()=>{ S.filters=DEF(); S.q=''; q.value=''; SAVE(); renderList(); };

/* =======================================================================
   Week plan
   ======================================================================= */
const THUMB_UP='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 14V6.5l3.2-4.8a1.3 1.3 0 0 1 2.4.7V6h3.1a1.3 1.3 0 0 1 1.27 1.6l-1.1 5A1.3 1.3 0 0 1 12.1 14H4.5Z" fill="currentColor"/><rect x="1" y="6.5" width="2.6" height="7.5" rx=".8" fill="currentColor"/></svg>';
const THUMB_DOWN='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.5 2v7.5l-3.2 4.8a1.3 1.3 0 0 1-2.4-.7V10H2.8A1.3 1.3 0 0 1 1.53 8.4l1.1-5A1.3 1.3 0 0 1 3.9 2h7.6Z" fill="currentColor"/><rect x="12.4" y="2" width="2.6" height="7.5" rx=".8" fill="currentColor"/></svg>';
const SHARE_I='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 11V2M8 2 5 5M8 2l3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 8.5V13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const LOCK='<svg width="13" height="15" viewBox="0 0 13 15" fill="none" aria-hidden="true"><rect x="1" y="6" width="11" height="8" rx="1.5" fill="currentColor"/><path d="M3.5 6V4a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.6"/></svg>';
const UNLOCK='<svg width="13" height="15" viewBox="0 0 13 15" fill="none" aria-hidden="true"><rect x="1" y="6" width="11" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 6V4a3 3 0 0 1 5.8-1" stroke="currentColor" stroke-width="1.5"/></svg>';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const SLOTS = [['breakfast','B'],['lunch','L'],['dinner','D'],['snack','S']];
const PROTEINS = ['chicken','beef','lamb','pork','seafood','eggs','tofu','legumes'];
function mainProtein(r){ return PROTEINS.find(p=>r.tags.includes(p)) || 'other'; }
function emptyPlan(){ return DAYS.map(()=>({breakfast:null,lunch:null,dinner:null,snack:null,lock:{},sv:{},who:{},lo:{}})); }

/* ---------- who is eating ---------- */
let PID = 1;
function newPerson(name, half){ return {id:'p'+(Date.now().toString(36))+(PID++), name:name||'', half:!!half}; }
function person(id){ return S.people.find(p=>p.id===id); }
function meId(){ return S.people.length ? S.people[0].id : null; }
function allIds(){ return S.people.map(p=>p.id); }
function whoFor(i, slot){
  const d = S.plan && S.plan[i];
  if(d && d.who && d.who[slot]) return d.who[slot].filter(person);
  const def = S.defaultWho[slot];
  return (def ? def.filter(person) : allIds());
}
function portions(ids){ return ids.reduce((a,id)=>{ const p=person(id); return a + (p ? (p.half?0.5:1) : 0); }, 0); }
function eatingIt(i, slot){ const m = meId(); return !m || whoFor(i,slot).includes(m); }

/* ---------- cook once, eat twice ---------- */
function isLeftover(i, slot){ const d=S.plan[i]; return !!(d && d.lo && d.lo[slot]); }
function leftoverSrc(i, slot){ const d=S.plan[i]; return (d && d.lo && d.lo[slot]) || null; }
function claimsOn(i, slot){          /* portions eaten elsewhere out of this batch */
  let extra = 0;
  S.plan.forEach((dd,j)=>SLOTS.forEach(([k])=>{
    const lo = dd.lo && dd.lo[k];
    if(lo && lo[0]===i && lo[1]===slot) extra += portions(whoFor(j,k)) || 1;
  }));
  return extra;
}
function makeLeftover(srcI, srcSlot, dstI, dstSlot){
  const d = S.plan[dstI];
  d[dstSlot] = S.plan[srcI][srcSlot];
  d.lo[dstSlot] = [srcI, srcSlot];
  delete d.sv[dstSlot];
  SAVE();
}
function unLeftover(i, slot){ delete S.plan[i].lo[slot]; SAVE(); }
/* keep leftovers pointing at whatever the source slot now holds */
function syncLeftovers(){
  if(!S.plan) return;
  S.plan.forEach((d,i)=>SLOTS.forEach(([k])=>{
    const lo = d.lo && d.lo[k]; if(!lo) return;
    const src = S.plan[lo[0]] && S.plan[lo[0]][lo[1]];
    if(src==null){ delete d.lo[k]; d[k]=null; }
    else d[k] = src;
  }));
}
/* fill every lunch with the previous night's dinner */
function reuseDinners(){
  if(!S.plan) return toast('Fill the week first');
  let n = 0;
  for(let i=0;i<6;i++){
    if(S.plan[i].dinner==null) continue;
    if(S.plan[i+1].lock.lunch) continue;
    makeLeftover(i, 'dinner', i+1, 'lunch');
    n++;
  }
  SAVE(); drawWeek(); drawShop();
  toast(n ? `${n} lunches are now last night's dinner` : 'No dinners to carry over');
}
/* how many serves you are cooking of that slot — the plan owns this, not the recipe */
function slotServes(i, slot){
  const d = S.plan[i], id = d[slot];
  if(id==null) return 0;
  if(isLeftover(i, slot)) return 0;          /* cooked in the source slot, not here */
  if(d.sv[slot]) return d.sv[slot];          /* you set it by hand */
  if(S.people.length){
    return Math.max(1, Math.ceil(portions(whoFor(i,slot)) + claimsOn(i, slot)));
  }
  return S.household || R[id].serves;
}
/* what the slot would cook if you had not overridden it */
function autoServes(i, slot){
  if(S.people.length) return Math.max(1, Math.ceil(portions(whoFor(i,slot)) + claimsOn(i, slot)));
  return S.household || (S.plan[i][slot]!=null ? R[S.plan[i][slot]].serves : 1);
}
function setSlotServes(i, slot, n){
  S.plan[i].sv[slot] = Math.max(1, Math.min(24, n));
  SAVE(); drawWeek(); drawShop();
}
function defaultServes(id){ return S.household || S.serves[id] || R[id].serves; }

function genWeekPlan(){
  const plan = S.plan && S.plan.length===7 ? S.plan : emptyPlan();
  const used = new Set();
  plan.forEach(d=>SLOTS.forEach(([k])=>{ if(d.lock[k] && d[k]!=null) used.add(d[k]); }));
  let narrowed = false;
  let lastProtein = null;

  for(let i=0;i<7;i++){
    for(const [slot] of SLOTS){
      if(plan[i].lock[slot] && plan[i][slot]!=null) continue;
      if(plan[i].lo && plan[i].lo[slot]) continue;      /* a leftover slot follows its source */
      let pool = results().filter(r=>r.types.includes(slot));
      if(pool.length<3){ pool = R.filter(r=>r.types.includes(slot)); narrowed = true; }
      let fresh = pool.filter(r=>!used.has(r.id));
      if(!fresh.length) fresh = pool;
      /* once you have rated some, lean on the ones you liked */
      const liked = S.like.length ? fresh.filter(r=>S.like.includes(r.id)) : [];
      if(liked.length && Math.random() < 0.45) fresh = liked;
      if(slot==='dinner' && lastProtein){
        const varied = fresh.filter(r=>mainProtein(r)!==lastProtein);
        if(varied.length>2) fresh = varied;
      }
      const pick = fresh[Math.floor(Math.random()*fresh.length)];
      plan[i][slot] = pick ? pick.id : null;
      if(!plan[i].sv) plan[i].sv = {};
      delete plan[i].sv[slot];
      if(pick && !S.people.length) plan[i].sv[slot] = S.household || pick.serves;
      if(pick){ used.add(pick.id); if(slot==='dinner') lastProtein = mainProtein(pick); }
    }
  }
  S.plan = plan; S.weekOf = mondayOf(new Date()); syncLeftovers(); SAVE();
  drawWeek(narrowed ? 'Your filters were too tight for some slots, so a few meals come from the full list.' : '');
}
function rerollSlot(i, slot){
  if(isLeftover(i, slot)) unLeftover(i, slot);   /* rerolling means you want your own meal */
  let pool = results().filter(r=>r.types.includes(slot));
  if(pool.length<2) pool = R.filter(r=>r.types.includes(slot));
  const cur = S.plan[i][slot];
  const fresh = pool.filter(r=>r.id!==cur);
  const next = (fresh.length?fresh:pool)[Math.floor(Math.random()*(fresh.length||pool.length))];
  S.plan[i][slot] = next.id;
  if(!S.plan[i].sv) S.plan[i].sv = {};
  if(!S.people.length && !S.plan[i].sv[slot]) S.plan[i].sv[slot] = S.household || next.serves;
  SAVE(); drawWeek(); drawShop();
}

/* ---------- pick a meal for one slot straight from the list ---------- */
let PICK = null;
function startPick(i, slot){
  PICK = {i, slot};
  S.filters = DEF(); S.filters.types = [slot]; S.q = ''; q.value = '';
  SAVE(); renderList();
  pickWhat.textContent = `Picking ${DAYS[i]} ${slot} — tap a meal`;
  pickBar.hidden = false;
  goView('find'); scrollTo(0,0);
}
function endPick(){ PICK = null; pickBar.hidden = true; }
function placePick(id){
  const {i, slot} = PICK;
  S.plan[i][slot] = id;
  delete S.plan[i].lo[slot];
  if(!S.people.length) S.plan[i].sv[slot] = S.household || R[id].serves;
  SAVE(); endPick(); drawWeek(); drawShop();
  goView('week');
  toast(`${DAYS[i]} ${slot}: ${R[id].name}`);
}
pickCancel.onclick = ()=>{ endPick(); goView('week'); };
function dayTotals(d, i){
  let t={p:0,c:0,f:0,kcal:0};
  SLOTS.forEach(([k])=>{ const id=d[k]; if(id==null) return;
    if(i!=null && !eatingIt(i,k)) return;      /* not your meal, not your macros */
    const m=macrosFor(R[id]);
    t.p+=m.p; t.c+=m.c; t.f+=m.f; t.kcal+=m.kcal; });
  return t;
}
function tClass(k,v){
  const g = +S.target[k]; if(!g) return '';
  if(k==='p') return v>=g?'over':'under';
  return v>g*1.05?'under':'';   /* calories: flag only when it runs over */
}
function drawWeek(note){
  weekHint.textContent = note!==undefined ? note : (S.plan?'Lock what you want to keep, then fill the week again.':'Nothing planned yet. Fill the week and it will honour whatever filters you have set.');
  if(!S.plan){ days.innerHTML=''; weekTotals.innerHTML=''; return; }
  syncLeftovers();
  whoLine.textContent = whoSummary();
  days.innerHTML = S.plan.map((d,i)=>{
    const t = dayTotals(d, i);
    return `<div class="dayblock">
      <div class="dayhead"><h3>${DAYS[i]}</h3>
        <span class="tot num"><b class="${tClass('kcal',t.kcal)}">${t.kcal}</b> cal &nbsp; <b class="${tClass('p',t.p)}">${t.p}g</b> protein</span></div>
      ${SLOTS.map(([k,ab])=>{
        const id=d[k], r=id==null?null:R[id], m=r?macrosFor(r):null;
        const lo = leftoverSrc(i,k), sv = r ? slotServes(i,k) : 0;
        if(!r) return `<div class="slot blank">
          <span class="kind">${ab}</span>
          <button class="nm" data-pick="${i}:${k}">Choose a ${k}</button>
          <button class="act" data-roll="${i}:${k}" aria-label="Pick one at random">↻</button>
        </div>`;
        const sub = lo ? `<em>Leftovers from ${DAYS[lo[0]]} ${lo[1]}</em>`
                       : `<em>${m.kcal} cal, ${m.p}g protein a serve</em>`;
        return `<div class="slot ${lo?'lo':''}">
          <span class="kind">${ab}</span>
          <button class="nm" data-open="${r.id}">${lo?'<span class="lotag">again</span>':''}${esc(r.name)}${sub}</button>
          <button class="act sv ${lo?'zero':''}" data-sv="${i}:${k}"
            aria-label="${lo?'Leftovers — nothing extra to cook':`Cooking ${sv} serve${sv>1?'s':''}`}, change">${lo?'↺':sv}</button>
          <button class="act" data-lock="${i}:${k}" aria-pressed="${!!d.lock[k]}" aria-label="${d.lock[k]?'Unlock':'Keep'} this meal">${d.lock[k]?LOCK:UNLOCK}</button>
          <button class="act" data-roll="${i}:${k}" aria-label="Swap">↻</button>
        </div>`}).join('')}
    </div>`}).join('');
  const w = S.plan.reduce((a,d,i)=>{const t=dayTotals(d,i);a.kcal+=t.kcal;a.p+=t.p;return a;},{kcal:0,p:0});
  weekTotals.innerHTML = `<span>Week: <span class="n num">${w.kcal}</span> cal, <span class="n num">${w.p}g</span> protein — averaging <span class="n num">${Math.round(w.kcal/7)}</span> cal and <span class="n num">${Math.round(w.p/7)}g</span> protein a day.</span>`;
}
tKcal.value = S.target.kcal; tProt.value = S.target.p;
tKcal.oninput = ()=>{ S.target.kcal=tKcal.value; SAVE(); drawWeek(); };
tProt.oninput = ()=>{ S.target.p=tProt.value; SAVE(); drawWeek(); };
genWeek.onclick   = genWeekPlan;
clearWeek.onclick = ()=>{ S.plan=null; S.weekOf=null; S.shopTicks=[]; S.shopHave=[]; SAVE(); drawWeek(); drawShop(); };
days.addEventListener('click', e=>{
  const l=e.target.closest('[data-lock]'), rl=e.target.closest('[data-roll]'),
        sv=e.target.closest('[data-sv]'), pk=e.target.closest('[data-pick]');
  if(pk){ const [i,k]=pk.dataset.pick.split(':'); return startPick(+i,k); }

  if(l){ const [i,k]=l.dataset.lock.split(':'); S.plan[i].lock[k]=!S.plan[i].lock[k]; SAVE(); drawWeek(); }
  if(rl){ const [i,k]=rl.dataset.roll.split(':'); rerollSlot(+i,k); }
});
copyWeek.onclick  = ()=> S.plan ? copy(weekText(),'Week copied') : toast('Fill the week first');
shareWeek.onclick = ()=> S.plan ? share('Our week of meals', weekText(), 'Week copied') : toast('Fill the week first');

/* ---------- who's eating ---------- */
function whoSummary(){
  if(!S.people.length) return S.household
    ? `Cooking ${S.household} serves of everything. Add the family to work it out per meal.`
    : 'Nobody set up yet — add yourself and the family and the serve counts work themselves out.';
  const names = S.people.map(p=>p.name + (p.half?' (half)':'')).join(', ');
  const dn = portions(S.defaultWho.dinner || allIds());
  return `${names}. Dinner cooks ${Math.ceil(dn)} serves by default.`;
}
function drawPeople(){
  peopleBody.innerHTML = `
    <p class="hint" style="margin-bottom:10px">The first person is you — your daily totals only count the meals you are in.</p>
    ${S.people.map((p,i)=>`
      <div class="prow">
        <input type="text" data-pname="${p.id}" value="${esc(p.name)}" placeholder="${i===0?'You':'Name'}" aria-label="Name">
        <button class="half" data-phalf="${p.id}" aria-pressed="${p.half}" aria-label="Half serve">${p.half?'half':'full'}</button>

    ${S.people.length?`
      <h2 class="sec">Who eats what, normally</h2>
      <p class="hint" style="margin-bottom:2px">You can change any single meal later in the plan.</p>
      ${SLOTS.map(([k])=>`
        <div style="margin:14px 0">
          <b style="font-size:13.5px;text-transform:capitalize">${k}</b>
          <div class="whogrid">
            ${S.people.map(p=>`<button data-def="${k}:${p.id}" aria-pressed="${whoDefault(k).includes(p.id)}">${esc(p.name||'?')}</button>`).join('')}
          </div>
          <span class="hint">cooks ${Math.max(1,Math.ceil(portions(whoDefault(k))||1))} serve${Math.ceil(portions(whoDefault(k)))>1?'s':''}</span>
        </div>`).join('')}`:''}`;
  const ap = document.getElementById('addPerson');
  if(ap) ap.onclick = ()=>{ S.people.push(newPerson('', S.people.length>=2)); SAVE(); drawPeople(); };
}
function whoDefault(slot){ return (S.defaultWho[slot] || allIds()).filter(person); }
peopleBody.addEventListener('input', e=>{
  const t=e.target.closest('[data-pname]'); if(!t) return;
  const p=person(t.dataset.pname); if(p){ p.name=t.value; SAVE(); }

peopleBody.addEventListener('click', e=>{

    if(S.plan) S.plan.forEach(day=>Object.keys(day.who).forEach(k=>day.who[k]=day.who[k].filter(x=>x!==id)));
    SAVE(); drawPeople();
  }
  if(f){ const [k,id]=f.dataset.def.split(':');
    const cur = whoDefault(k);
    S.defaultWho[k] = cur.includes(id) ? cur.filter(x=>x!==id) : cur.concat(id);
    SAVE(); drawPeople();
  }
});
openPeople.onclick = ()=>{
  if(!S.people.length){ S.people = [newPerson('', false)]; SAVE(); }
  drawPeople(); openSheet('peopleSheet');
};
peopleDone.onclick = ()=>{
  S.people = S.people.filter(p=>p.name.trim());

};
